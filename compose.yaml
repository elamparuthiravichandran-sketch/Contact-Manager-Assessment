services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.py first}
      MSSQL_PID: Developer
    volumes:
      - contacts-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: src/Contacts.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Contacts: Server=db;Database=ContactsDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      Auth__Username: ${DEMO_USERNAME}
      Auth__Password: ${DEMO_PASSWORD}
      Auth__SigningKey: ${JWT_KEY}
      Database__Initialize: "true"
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  contacts-data:
